name: iOS Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project DynamicIsland.xcodeproj \
            -scheme DynamicIsland \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload build/artifact
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/Dynamic Island.app"
          test -d "$APP_PATH"
          ditto "$APP_PATH" "build/Payload/Dynamic Island.app"
          cd build
          /usr/bin/zip -qry artifact/DynamicIsland-unsigned.ipa Payload

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-unsigned-iOS-app
          path: build/artifact/DynamicIsland-unsigned.ipa
          retention-days: 7
