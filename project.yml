name: DynamicIsland
options:
  bundleIdPrefix: com.dynamicisland
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.dynamicisland.iphone11
    INFOPLIST_KEY_CFBundleDisplayName: "Dynamic Island"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    GENERATE_INFOPLIST_FILE: YES
targets:
  DynamicIsland:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_NAME: "Dynamic Island"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
